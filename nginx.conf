server {
    listen 10000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Archivos de entrada críticos que NO deben cachearse nunca
    location ~* (index\.html|version\.json|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Archivos JavaScript de Flutter (se revalidan vía ETag, pero no se bloquean)
    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Configuración para SPA (Flutter Web)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos inmutables (CSS, imágenes, fuentes)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss 
               application/json image/svg+xml;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # CORS para tu API
    add_header Access-Control-Allow-Origin "https://jht-transport-api.onrender.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
}